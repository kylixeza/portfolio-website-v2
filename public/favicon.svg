<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#f5f1ef" />
      <stop offset="100%" stop-color="#d5ccc8" />
    </radialGradient>
    <radialGradient id="skin" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#f3cbb0" />
      <stop offset="65%" stop-color="#dfad8a" />
      <stop offset="100%" stop-color="#c38a66" />
    </radialGradient>
    <radialGradient id="hair" cx="35%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#403733" />
      <stop offset="50%" stop-color="#221d1b" />
      <stop offset="100%" stop-color="#120f0e" />
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35302c" />
      <stop offset="100%" stop-color="#1b1815" />
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#2b2622" flood-opacity="0.24" />
    </filter>
    <clipPath id="tile">
      <rect width="64" height="64" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" rx="16" fill="url(#bg)" />
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5" />

    <!-- Dark charcoal crewneck / shoulders -->
    <path d="M11 66c2-11 10-16 21-16s19 5 21 16z" fill="url(#hoodie)" filter="url(#shadow)" />
    <!-- Subtle green collar accent -->
    <path d="M25 50.8c2.2 2.4 4.5 3.4 7 3.4s4.8-1 7-3.4" fill="none" stroke="#0f7d45" stroke-width="1.8" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="27" y="42" width="10" height="11" rx="5" fill="#c38a66" />

    <!-- Head -->
    <g filter="url(#shadow)">
      <!-- Ears -->
      <ellipse cx="17.2" cy="34" rx="3" ry="4.4" fill="#d39c79" />
      <ellipse cx="46.8" cy="34" rx="3" ry="4.4" fill="#d39c79" />

      <!-- Jawline / Face (slightly tapered, less round) -->
      <path d="M18 28c0-8 6-13 14-13s14 5 14 13v6.5c0 8.2-5.8 14-14 14s-14-5.8-14-14z" fill="url(#skin)" />

      <!-- Voluminous textured hair matching portrait -->
      <path
        d="M16.5 31.5c-1-10.5 4.8-19.5 15.5-20 10.5-.4 16.5 7.5 15.5 19.5-.8-3.8-2.3-6.5-4.5-8.2-1.8 2-4.8 3-8.5 2.4-1.5 1.8-4.2 2.6-7.5 1.8-2.2 1.6-4.8 2.2-7.2 1.2-1.5 1-2.5 2-3.3 3.3z"
        fill="url(#hair)"
      />
      <path d="M22 15.5c5-2.5 12-2.5 17 0" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Confident brows -->
    <path d="M21.5 28c1.8-.8 4-.7 5.6.1" fill="none" stroke="#1e1917" stroke-width="1.7" stroke-linecap="round" />
    <path d="M36.9 28.1c1.6-.8 3.8-.9 5.6-.1" fill="none" stroke="#1e1917" stroke-width="1.7" stroke-linecap="round" />

    <!-- Relaxed eyes -->
    <ellipse cx="24.6" cy="32.4" rx="1.6" ry="1.4" fill="#1e1815" />
    <ellipse cx="39.4" cy="32.4" rx="1.6" ry="1.4" fill="#1e1815" />
    <circle cx="24.1" cy="31.9" r="0.5" fill="#ffffff" />
    <circle cx="38.9" cy="31.9" r="0.5" fill="#ffffff" />

    <!-- Subtle nose shadow -->
    <path d="M32.2 33.2c.6 2 .5 3.3-.6 3.9" fill="none" stroke="#b07554" stroke-width="1.3" stroke-linecap="round" />

    <!-- Subtle relaxed smirk -->
    <path d="M28.6 41.8c2.4 1.2 5.2 1.1 7.2-.4" fill="none" stroke="#854a38" stroke-width="1.6" stroke-linecap="round" />

    <!-- Thin round frames -->
    <g stroke="#2b2622" stroke-width="1.15" fill="url(#lens)">
      <circle cx="24.6" cy="32.6" r="5" />
      <circle cx="39.4" cy="32.6" r="5" />
      <path d="M29.6 32.1c1.6-.6 3.2-.6 4.8 0" fill="none" />
      <path d="M17.8 31.8l1.8.4M44.4 32.2l1.8-.4" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
